name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          version="8.30.1"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-bin"

          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output "$archive"

          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum --check

          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Verify detection control
        shell: bash
        run: |
          set -euo pipefail

          control_dir="$RUNNER_TEMP/gitleaks-control"
          mkdir -p "$control_dir"

          CONTROL_DIR="$control_dir" python - <<'PY'
          from pathlib import Path
          import os
          import secrets
          import string

          alphabet = string.ascii_letters + string.digits
          suffix = "".join(secrets.choice(alphabet) for _ in range(36))
          Path(os.environ["CONTROL_DIR"], "control.txt").write_text(
              f"GITHUB_TOKEN=ghp_{suffix}\n",
              encoding="utf-8",
          )
          PY

          set +e
          gitleaks dir \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --no-banner \
            --redact \
            --exit-code 42 \
            "$control_dir"
          status=$?
          set -e

          rm -rf "$control_dir"

          if [ "$status" -ne 42 ]; then
            echo "Gitleaks control test did not detect the generated fake credential."
            exit 1
          fi

          echo "Gitleaks control test detected the generated fake credential as expected."

      - name: Scan Git history
        run: |
          gitleaks git \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --verbose \
            --exit-code 1 \
            --log-opts="--all" \
            .
