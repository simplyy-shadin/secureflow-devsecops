services:
  api:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/secureflow.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - secureflow-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  secureflow-data:
